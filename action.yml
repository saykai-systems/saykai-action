name: Saykai Safety Gate
description: Audit Nav2/ROS2 robot configs in CI and block on safety violations
author: Saykai

# Add branding to look professional in the Marketplace
branding:
  icon: 'shield'
  color: 'green'

inputs:
  runner-repo:
    description: Repo that hosts the runner release assets (owner/name). This is a dedicated, source-free release-hosting repo, not the runner's own source repo.
    required: false
    default: saykai-systems/saykai-releases
  runner-version:
    description: Runner release tag (e.g., v1.0.1) or 'latest'
    required: false
    default: latest
  runner-base-url:
    description: Optional override download base (e.g., https://downloads.saykai.com/runner)
    required: false

  # Crucial: Matches "with: github-token" in README
  github-token:
    description: Token with read access to the runner-repo release assets. Scope this to runner-repo only -- it should never have access to Saykai's source repo.
    required: true

  # Crucial: Matches "with: spec-path" in README
  spec-path:
    description: Path to saykai.yml
    required: false
    default: saykai.yml

  # Added to match README "Configuration" table
  fail-on-error:
    description: >-
      If true (the default), the job fails when the gate blocks a change or
      cannot complete. If false, the job never fails: blocked changes are
      reported as warnings but are NOT stopped. Use false only to trial the
      gate without enforcing it.
    required: false
    default: 'true'

  observe:
    description: >-
      If true, run in shadow mode: the gate reports everything it would
      block, but the job does not fail. The evidence records the run as
      shadow mode, so it can never be mistaken for an enforced run. Use it to
      trial the gate on real pull requests, then remove it to enforce.
    required: false
    default: 'false'

  artifact-name:
    description: >-
      Name of the uploaded evidence artifact (safety_pack.json). If the gate
      runs more than once in the same job, give each run a different name:
      GitHub rejects a name already used in that job, so the later run's
      evidence would not be kept. In a matrix, a name per entry makes the
      evidence files easy to tell apart.
    required: false
    default: saykai-safety-pack

  repo-token:
    description: >-
      Optional. A token with pull-requests:write on YOUR OWN repo (not
      runner-repo) -- typically your workflow's own default, auto-generated
      per-run GITHUB_TOKEN secret, already scoped to your repo. When set,
      posts/updates a single PR comment summarizing the run. Requires your
      workflow to grant pull-requests:write permission. Left unset by
      default: no comment is posted, and the gate behaves exactly as before.
    required: false
    default: ''

  signing-key:
    description: >-
      Optional. Your private signing key (the contents of saykai-signing.key,
      made once with `saykai-runner keygen`), passed as a secret. When set,
      the safety pack is signed with it, so anyone holding your public key
      can verify the evidence later. When unset or empty (for example on pull
      requests from forks, which cannot read secrets), the run is signed with
      a temporary key that is discarded when the job ends, and nobody can
      verify it afterwards. Needs saykai-runner v1.4.0 or newer.
    required: false
    default: ''

outputs:
  outcome:
    description: PASS or BLOCK from the gate, or ERROR if the gate could not produce a result. In shadow mode, BLOCK means the change would have been blocked.
    value: ${{ steps.result.outputs.outcome }}
  mode:
    description: ENFORCEMENT, or OBSERVER when observe is true (shadow mode).
    value: ${{ steps.result.outputs.mode }}
  blocking-findings:
    description: Number of findings that blocked the change (0 on a pass).
    value: ${{ steps.result.outputs.blocking-findings }}
  findings:
    description: Total number of findings, including non-blocking review findings.
    value: ${{ steps.result.outputs.findings }}
  trace-id:
    description: Trace ID of this run, as recorded in the safety pack.
    value: ${{ steps.result.outputs.trace-id }}
  signed-by-key:
    description: Key ID that signed the safety pack. With signing-key set, this is your persistent key.
    value: ${{ steps.result.outputs.signed-by-key }}
  evidence-uploaded:
    description: true if the signed safety pack was uploaded as an artifact, false otherwise.
    value: ${{ steps.upload.outcome == 'success' }}

runs:
  using: composite
  steps:
    # This step always exits 0 -- the real pass/fail decision is made in
    # "Enforce fail-on-error policy" below, AFTER the artifact upload runs.
    # Doing it this way (rather than exiting non-zero here directly) means a
    # BLOCK verdict can't skip the artifact upload, since a failed step
    # would otherwise stop the rest of the composite action's steps.
    - name: Run Saykai
      id: run
      shell: bash
      env:
        SAYKAI_RUNNER_TOKEN: ${{ inputs.github-token }}
        SAYKAI_SIGNING_KEY: ${{ inputs.signing-key }}
        SAYKAI_OBSERVE: ${{ inputs.observe }}
      run: |
        set +e
        bash "${{ github.action_path }}/scripts/run.sh" \
          "${{ inputs.runner-repo }}" \
          "${{ inputs.runner-version }}" \
          "${{ inputs.runner-base-url }}" \
          "${{ inputs.spec-path }}" \
          "${{ inputs.repo-token }}"
        EXIT_CODE=$?
        set -e
        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        exit 0

    # Reads the run's own result files into step outputs. Reporting only:
    # it always exits 0 and never touches the verdict, which is decided by
    # the runner's exit code in "Enforce fail-on-error policy" below.
    - name: Read Saykai result
      id: result
      if: always()
      shell: bash
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT" || echo "outcome=ERROR" >> "$GITHUB_OUTPUT"
        import json
        def load(path):
            try:
                with open(path, encoding="utf-8") as f:
                    return json.load(f)
            except (OSError, ValueError):
                return {}
        r = load("outputs/run-result.json")
        pack = load("safety_pack.json")
        summary = r.get("summary") or {}
        print("outcome=" + str(r.get("outcome") or "ERROR"))
        print("mode=" + str(r.get("mode") or ""))
        print("blocking-findings=" + str(summary.get("blocking_findings", "")))
        print("findings=" + str(summary.get("findings_count", "")))
        print("trace-id=" + str(r.get("trace_id") or ""))
        print("signed-by-key=" + str(pack.get("signed_by_key_fingerprint") or ""))
        PY

    # Uploads the signed safety pack regardless of pass/fail -- this is the
    # actual portable evidence artifact (audit/governance), not just a CI
    # convenience. continue-on-error: true because an upload failure (e.g. a
    # transient network issue) is a reporting problem, not a safety one --
    # it must never be able to affect the gate's real verdict below.
    - name: Upload Saykai safety pack
      id: upload
      if: always()
      continue-on-error: true
      # Pinned to the exact commit of v6.0.0, so the code that handles
      # customers' evidence can't change underneath them. v6 is v4's upload
      # behavior on Node 24 (Node 20 is being retired on GitHub runners); it
      # needs Actions runner 2.327.1 or newer.
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: ${{ inputs.artifact-name }}
        path: safety_pack.json
        if-no-files-found: error
        retention-days: 90

    # The upload is allowed to fail without failing the job (a network blip
    # is a reporting problem, not a safety one), but it must never fail
    # silently: missing evidence is exactly what an auditor will ask about.
    - name: Report missing evidence
      if: always() && steps.upload.outcome != 'success'
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        echo "::warning title=Evidence not saved::The signed safety pack was not uploaded as artifact '${ARTIFACT_NAME}'. If the gate runs more than once in this job, give each run a different artifact-name. Otherwise check the upload step's log."

    - name: Enforce fail-on-error policy
      shell: bash
      env:
        SAYKAI_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        OUTCOME: ${{ steps.result.outputs.outcome }}
      run: |
        if [ "${EXIT_CODE:-0}" -ne 0 ]; then
          if [ "${OUTCOME}" == "BLOCK" ]; then
            WHAT="Saykai Safety Gate blocked this change"
          else
            WHAT="Saykai Safety Gate could not complete"
          fi
          if [ "${SAYKAI_FAIL_ON_ERROR}" == "true" ]; then
            echo "::error::${WHAT} (exit code ${EXIT_CODE})."
            exit "$EXIT_CODE"
          else
            echo "::warning::${WHAT} (exit code ${EXIT_CODE}), but fail-on-error is false, so this job is not failing and the change is not stopped."
            exit 0
          fi
        fi
